<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1600" viewBox="0 0 2560 1600">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11111b"/>
      <stop offset="0.55" stop-color="#181825"/>
      <stop offset="1" stop-color="#1e1e2e"/>
    </linearGradient>

    <radialGradient id="blue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#89b4fa" stop-opacity="0.62"/>
      <stop offset="0.55" stop-color="#89b4fa" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#89b4fa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mauve" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#cba6f7" stop-opacity="0.60"/>
      <stop offset="0.55" stop-color="#cba6f7" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#cba6f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="teal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#94e2d5" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#94e2d5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f5c2e7" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#f5c2e7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.72">
      <stop offset="0.45" stop-color="#11111b" stop-opacity="0"/>
      <stop offset="1" stop-color="#0b0b12" stop-opacity="0.82"/>
    </radialGradient>

    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="110"/>
    </filter>
    <filter id="soft2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>

    <pattern id="dots" width="46" height="46" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.15" fill="#cdd6f4" fill-opacity="0.10"/>
    </pattern>
  </defs>

  <rect width="2560" height="1600" fill="url(#base)"/>

  <!-- Aurora blobs -->
  <g filter="url(#soft)">
    <ellipse cx="360" cy="1210" rx="720" ry="560" fill="url(#blue)"/>
    <ellipse cx="2190" cy="300" rx="760" ry="560" fill="url(#mauve)"/>
    <ellipse cx="1930" cy="1370" rx="600" ry="430" fill="url(#teal)"/>
    <ellipse cx="760" cy="210" rx="560" ry="380" fill="url(#pink)"/>
  </g>

  <!-- Fine dot grid -->
  <rect width="2560" height="1600" fill="url(#dots)" opacity="0.55"/>

  <!-- Abstract snowflake / geometry -->
  <g transform="translate(1280 800)" fill="none" stroke="#cdd6f4" stroke-opacity="0.075" stroke-width="2.5">
    <g id="arm">
      <path d="M0 -470 L0 -180"/>
      <path d="M0 -430 L-92 -360 M0 -430 L92 -360"/>
      <path d="M0 -330 L-66 -282 M0 -330 L66 -282"/>
      <circle cx="0" cy="-180" r="9"/>
    </g>
    <use href="#arm" transform="rotate(60)"/>
    <use href="#arm" transform="rotate(120)"/>
    <use href="#arm" transform="rotate(180)"/>
    <use href="#arm" transform="rotate(240)"/>
    <use href="#arm" transform="rotate(300)"/>
    <circle cx="0" cy="0" r="118"/>
    <circle cx="0" cy="0" r="150" stroke-opacity="0.035"/>
  </g>

  <!-- Glow accents -->
  <g filter="url(#soft2)">
    <circle cx="2060" cy="1030" r="190" fill="#89b4fa" fill-opacity="0.12"/>
    <circle cx="540" cy="760" r="150" fill="#cba6f7" fill-opacity="0.12"/>
  </g>

  <!-- Edge vignette -->
  <rect width="2560" height="1600" fill="url(#vignette)"/>

  <!-- Subtle bottom sheen -->
  <rect y="1480" width="2560" height="120" fill="url(#base)" opacity="0.35"/>
</svg>
