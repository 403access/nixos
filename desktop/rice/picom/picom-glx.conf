# Picom – GLX backend for hardware (blur, rounded corners, shadows).
# The rice profile picks this automatically when /dev/dri exists; the
# OrbStack VM has no DRM device and uses picom.conf (XRender) instead.
backend = "glx";
vsync = true;
glx-no-stencil = true;
glx-no-rebind-pixmap = true;
use-damage = true;
unredir-if-possible = false;
detect-transient = true;
detect-client-leader = true;

shadow = true;
shadow-radius = 18;
shadow-opacity = 0.5;
shadow-offset-x = 0;
shadow-offset-y = 8;
shadow-exclude = [
  "class_g = 'Polybar'",
  "class_g = 'i3-frame'",
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "name = 'rofi'",
  "class_g = 'flameshot'"
];

corner-radius = 12;
rounded-corners-exclude = [
  "class_g = 'Polybar'",
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'flameshot'"
];

blur-background = true;
blur-method = "dual_kawase";
blur-strength = 5;
blur-background-frame = false;
blur-background-fixed = false;
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Polybar'",
  "name = 'rofi'",
  "class_g = 'flameshot'"
];

fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 8;

inactive-opacity = 0.94;
active-opacity = 1.0;
frame-opacity = 0.9;

opacity-rule = [
  "95:class_g = 'kitty'"
];
