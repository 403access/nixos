# Picom – software-friendly compositor for the X11 rice (and VNC)
backend = "xrender";
vsync = false;
use-damage = true;
unredir-if-possible = false;
detect-transient = true;
detect-client-leader = true;

shadow = true;
shadow-radius = 14;
shadow-opacity = 0.45;
shadow-offset-x = 0;
shadow-offset-y = 6;
shadow-exclude = [
  "class_g = 'Polybar'",
  "class_g = 'i3-frame'",
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "name = 'rofi'",
  "class_g = 'flameshot'"
];

corner-radius = 12;
rounded-corners-exclude = [
  "class_g = 'Polybar'",
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'flameshot'"
];

fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 8;

inactive-opacity = 0.94;
active-opacity = 1.0;
frame-opacity = 0.9;

opacity-rule = [
  "95:class_g = 'kitty'"
];
