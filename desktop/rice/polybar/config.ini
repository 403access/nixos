; Polybar – Catppuccin Mocha
[global/wm]
margin-top = 0
margin-bottom = 0

[bar/main]
width = 96%
height = 38
offset-x = 2%
offset-y = 10
background = #cc1e1e2e
foreground = #cdd6f4
radius = 14
border-size = 1
border-color = #45475a
padding-left = 14
padding-right = 14
module-margin-left = 10
module-margin-right = 10
font-0 = JetBrainsMono Nerd Font:size=10;3
font-1 = Inter:size=10;2
font-2 = Noto Color Emoji:size=10;2
modules-left = i3 xwindow
modules-center = date
modules-right = pulseaudio memory cpu tray powermenu
override-redirect = false
cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true
fixed-center = true
dpi = 96
line-color = #89b4fa
line-size = 2

[module/i3]
type = internal/i3
format = <label-state> <label-mode>
index-sort = true
wrapping-scroll = false
strip-wsnumbers = false
pin-workspaces = true
label-mode-padding = 2
label-mode-foreground = #11111b
label-mode-background = #89b4fa
label-focused = %index%
label-focused-background = #89b4fa
label-focused-foreground = #11111b
label-focused-padding = 5
label-unfocused = %index%
label-unfocused-foreground = #a6adc8
label-unfocused-padding = 5
label-urgent = %index%!
label-urgent-background = #f38ba8
label-urgent-foreground = #11111b
label-urgent-padding = 5
label-separator = " "
label-separator-foreground = #6c7086

[module/xwindow]
type = internal/xwindow
format = <label>
label = %title%
label-empty =
label-maxlen = 60
label-foreground = #a6adc8

[module/date]
type = internal/date
interval = 1
date = "%a %d %b  %H:%M"
time-alt = "%H:%M"
format = <label>
label = %date%
label-foreground = #cdd6f4
label-padding = 4

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <label-volume>
label-volume = %percentage%%
label-volume-foreground = #cdd6f4
label-muted = muted
label-muted-foreground = #6c7086
format-prefix = "VOL "
format-prefix-foreground = #89b4fa
click-right = pavucontrol
scroll-up = pamixer -i 5
scroll-down = pamixer -d 5

[module/memory]
type = internal/memory
interval = 2
format = <label>
label = %percentage_used%%
label-foreground = #cdd6f4
format-prefix = "RAM "
format-prefix-foreground = #94e2d5

[module/cpu]
type = internal/cpu
interval = 2
format = <label>
label = %percentage%%
label-foreground = #cdd6f4
format-prefix = "CPU "
format-prefix-foreground = #cba6f7

[module/tray]
type = internal/tray
format = <tray>
tray-size = 70%
spacing = 6
tray-padding = 0

[module/powermenu]
type = custom/script
exec = echo "⏻"
format-foreground = #f38ba8
format-padding = 4
click-left = desktop-powermenu
