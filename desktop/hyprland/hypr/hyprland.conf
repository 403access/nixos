# Hyprland – Catppuccin Mocha
# Modifier: Super (Windows key)

monitor=,preferred,auto,1

$mod = SUPER
$terminal = kitty
$menu = rofi -show drun
$browser = firefox
$files = thunar

env = XCURSOR_THEME,catppuccin-mocha-dark-cursors
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_STYLE_OVERRIDE,kvantum
env = GDK_BACKEND,wayland,x11
env = NIXOS_OZONE_WL,1
env = ELECTRON_OZONE_PLATFORM_HINT,auto

exec-once = waybar
exec-once = hyprpaper
exec-once = hypridle
exec-once = mako
exec-once = desktop-polkit-agent
exec-once = blueman-applet
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

general {
    gaps_in = 6
    gaps_out = 16
    border_size = 2
    col.active_border = rgba(89b4faff) rgba(cba6f7ff) 45deg
    col.inactive_border = rgba(313244aa)
    layout = dwindle
    resize_on_border = true
    allow_tearing = false
}

decoration {
    rounding = 12
    active_opacity = 1.0
    inactive_opacity = 0.94
    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = rgba(11111bcc)
    }
    blur {
        enabled = true
        size = 6
        passes = 3
        ignore_opacity = true
        xray = false
    }
}

animations {
    enabled = true
    bezier = easeOut, 0.05, 0.9, 0.1, 1.0
    animation = windows, 1, 5, easeOut
    animation = windowsOut, 1, 4, easeOut, popin 85%
    animation = border, 1, 10, default
    animation = fade, 1, 6, default
    animation = workspaces, 1, 5, easeOut, slide
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vfr = true
}

input {
    kb_layout = de
    kb_variant =
    kb_model =
    kb_options =
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

binds {
    workspace_back_and_forth = true
    allow_workspace_cycles = true
}

# Applications
bind = $mod, Return, exec, $terminal
bind = $mod, D, exec, $menu
bind = $mod SHIFT, D, exec, rofi -show run
bind = $mod, B, exec, $browser
bind = $mod, E, exec, $files
bind = $mod SHIFT, X, exec, desktop-powermenu
bind = $mod SHIFT, N, exec, lxappearance

# Screenshots and lock
bind = , Print, exec, grim -g "$(slurp)" - | swappy -f -
bind = $mod SHIFT, S, exec, grim -g "$(slurp)" - | swappy -f -
bind = $mod, Escape, exec, hyprlock

# Window management
bind = $mod, Q, killactive,
bind = $mod SHIFT, E, exit,
bind = $mod, V, togglefloating,
bind = $mod, F, fullscreen,
bind = $mod, P, pseudo,
bind = $mod, S, togglesplit,

# Focus
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, K, movefocus, u
bind = $mod, J, movefocus, d

# Move
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, L, movewindow, r
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, J, movewindow, d

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

# Mouse
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Media keys
bind = , XF86AudioRaiseVolume, exec, pamixer -i 5
bind = , XF86AudioLowerVolume, exec, pamixer -d 5
bind = , XF86AudioMute, exec, pamixer -t
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous
bind = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
