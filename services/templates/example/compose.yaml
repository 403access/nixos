# Example project stack.
#
# Copy this directory to /var/lib/projects/example (or your own name) and run
# sudo project-up example.  Then open http://127.0.0.1:8080/.
#
# Hardening shown here:
#   - read-only root filesystem, tmpfs for scratch space
#   - all capabilities dropped, no-new-privileges
#   - non-root UID
#   - one project network; the host is the only ingress via 127.0.0.1
#   - published on 127.0.0.1 only, never on 0.0.0.0
#   - no docker socket, no host network, no privileged mode
name: example

services:
  whoami:
    image: docker.io/traefik/whoami:v1.10
    command: ["--port=8080"]
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "65534:65534"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - edge

# A published service needs a normal bridge: Docker does not forward ports
# from an internal network (no default gateway).  Use internal networks for
# backend-only services (databases, workers) and put a proxy in front if the
# frontend must not have egress.
networks:
  edge:
    driver: bridge